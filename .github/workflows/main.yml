name: 有声小说爬虫测试

on:
  workflow_dispatch:

jobs:
  test-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 运行爬虫测试 (需登录)
        env:
          TING13_COOKIES: ${{ secrets.TING13_COOKIES }}   # 在仓库 Settings -> Secrets 中添加
        run: python test_crawler.py
