name: 有声小说爬虫测试

on:
  workflow_dispatch:          # 手动触发，避免定时抓取
  # push:
  #   branches: [ main ]

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: 运行完整爬虫
        env:
          TING13_COOKIES: ${{ secrets.TING13_COOKIES }}
        run: python crawler_full.py
