name: 有声小说爬虫

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests beautifulsoup4 playwright
             && playwright install --with-deps chromium

      - name: 运行爬虫
        env:
          TING13_COOKIES: ${{ secrets.TING13_COOKIES }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          BOOK_KEY: "赘婿"
        run: python crawler.py
